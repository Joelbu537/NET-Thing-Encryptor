name: Cross-platform build and release gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shared-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      AVALONIA_TELEMETRY_OPTOUT: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install Linux desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libvlc5 vlc-plugin-base vlc-plugin-video-output \
            libx11-6 libice6 libsm6 libfontconfig1

      - name: Test platform-neutral core
        run: dotnet run --project ./Nte.Core.Tests/Nte.Core.Tests.csproj -c Release -- --minimum-expected-tests 1

      - name: Test cross-platform storage and transfer
        run: dotnet run --project ./Nte.Storage.Tests/Nte.Storage.Tests.csproj -c Release -- --minimum-expected-tests 1

      - name: Test shared Avalonia application layer
        run: dotnet run --project ./Nte.App.Tests/Nte.App.Tests.csproj -c Release -- --minimum-expected-tests 1

      - name: Publish Linux remote vault server
        run: dotnet publish ./Nte.RemoteServer/Nte.RemoteServer.csproj -c Release -r linux-x64 --self-contained false -o ./artifacts/staging/server/linux-x64/publish

      - name: Upload Linux remote vault server
        uses: actions/upload-artifact@v4
        with:
          name: NET-Thing-Encryptor-Remote-Server-linux-x64
          path: ./artifacts/staging/server/linux-x64/publish
          if-no-files-found: error

      - name: Build Linux desktop packages
        shell: pwsh
        run: ./build/build-linux-package.ps1 -Clean

      - name: Verify Linux package metadata
        run: |
          dpkg-deb --info ./artifacts/release/desktop/linux-x64/*.deb
          dpkg-deb --contents ./artifacts/release/desktop/linux-x64/*.deb

      - name: Install Linux desktop package
        run: sudo apt-get install --yes ./artifacts/release/desktop/linux-x64/*.deb

      - name: Probe native media runtime
        run: net-thing-encryptor --media-runtime-probe

      - name: Probe Linux desktop startup
        run: xvfb-run -a net-thing-encryptor --startup-probe

      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: NET-Thing-Encryptor-linux-x64
          path: |
            ./artifacts/release/desktop/linux-x64/*.deb
            ./artifacts/release/desktop/linux-x64/*.tar.gz
            ./artifacts/release/desktop/linux-x64/*.sha256
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Publish macOS desktop client
        run: dotnet publish ./Nte.Desktop/Nte.Desktop.csproj -c Release -r osx-arm64 --self-contained false -o ./artifacts/staging/desktop/macos-arm64/publish

      - name: Upload macOS cross-publish
        uses: actions/upload-artifact@v4
        with:
          name: NET-Thing-Encryptor-osx-arm64
          path: ./artifacts/staging/desktop/macos-arm64/publish
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Android release packages
        run: dotnet publish ./Nte.Android/Nte.Android.csproj -c Release

      - name: Verify Android package formats
        shell: pwsh
        run: |
          $output = '.\Nte.Android\bin\Release\net10.0-android'
          if (-not (Get-ChildItem $output -Filter '*.aab' -File -Recurse)) {
            throw 'Android release did not create an AAB.'
          }
          if (-not (Get-ChildItem $output -Filter '*.apk' -File -Recurse)) {
            throw 'Android release did not create an APK.'
          }

      - name: Upload Android test packages
        uses: actions/upload-artifact@v4
        with:
          name: NET-Thing-Encryptor-Android-unsigned
          path: |
            ./Nte.Android/bin/Release/net10.0-android/*.aab
            ./Nte.Android/bin/Release/net10.0-android/*.apk
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress --yes
          }

      - name: Build and test Avalonia installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content '.\Nte.Desktop\Nte.Desktop.csproj'
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          .\build\build-installer.ps1 -Clean -ExpectedVersion $version
          $installer = ".\artifacts\release\desktop\windows-x64\NET-Thing-Encryptor-Setup-$version.exe"
          .\build\test-installer.ps1 -InstallerPath $installer -ExpectedVersion $version -RunInstallation

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NET-Thing-Encryptor-installer
          path: |
            artifacts/release/desktop/windows-x64/*.exe
            artifacts/release/desktop/windows-x64/*.sha256
          if-no-files-found: error

  windows-upgrade-proof:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 and .NET 11 Preview 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.400
            11.0.100-preview.7.26381.103

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress --yes
          }

      - name: Test WinForms rollback source
        run: dotnet test ./build/legacy-winforms.slnf -c Release

      - name: Build rollback and Avalonia installers
        shell: pwsh
        run: |
          [xml]$legacyProject = Get-Content '.\NET Thing Encryptor\NET Thing Encryptor.csproj'
          [xml]$avaloniaProject = Get-Content '.\Nte.Desktop\Nte.Desktop.csproj'
          $legacyVersion = $legacyProject.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $avaloniaVersion = $avaloniaProject.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          .\build\build-installer.ps1 -ProductLine WinFormsRollback -Clean -SkipTests -ExpectedVersion $legacyVersion
          .\build\build-installer.ps1 -Clean -SkipTests -ExpectedVersion $avaloniaVersion

      - name: Prove WinForms-to-Avalonia in-place upgrade
        shell: pwsh
        run: |
          [xml]$legacyProject = Get-Content '.\NET Thing Encryptor\NET Thing Encryptor.csproj'
          [xml]$avaloniaProject = Get-Content '.\Nte.Desktop\Nte.Desktop.csproj'
          $legacyVersion = $legacyProject.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $avaloniaVersion = $avaloniaProject.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          .\build\test-winforms-upgrade.ps1 `
            -LegacyInstallerPath ".\artifacts\verification\legacy-winforms\windows-x64\NET-Thing-Encryptor-WinForms-Rollback-Setup-$legacyVersion.exe" `
            -AvaloniaInstallerPath ".\artifacts\release\desktop\windows-x64\NET-Thing-Encryptor-Setup-$avaloniaVersion.exe" `
            -LegacyExpectedVersion $legacyVersion `
            -AvaloniaExpectedVersion $avaloniaVersion
